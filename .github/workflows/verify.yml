name: BudgetLoom verification
on:
  push:
    branches:
      - "feat/budgetloom-growth-foundation-*"
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Type-check
        run: npx tsc --noEmit
      - name: Production build
        run: npm run build
